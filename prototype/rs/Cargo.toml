[package]
name = "t06-bench"
version = "0.0.0"
edition = "2021"
description = "Throwaway spike: bitboard beam-search kernel benchmarks for ticket 06"

[lib]
name = "t06"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench"
path = "src/main.rs"

[features]
default = ["word32"]
word32 = []
word64 = []
simd = []
lines_live = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
