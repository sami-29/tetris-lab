<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tetris Lab — a board from wasm</title>
    <!-- Ticket 01: the shell is deliberately plain. The workbench layout, the
         toolbar and the visual system arrive with tickets 13 and 14. -->
    <style>
      :root {
        color-scheme: dark;
        font-variant-numeric: tabular-nums;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f14;
        color: #dbe6f2;
        font: 14px/1.45 ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
      }
      body {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px 18px;
        box-sizing: border-box;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 18px;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: lowercase;
      }
      #status,
      #outcome,
      #progress {
        margin: 0;
        font-size: 12px;
        color: #8ea3c0;
        min-height: 1.45em;
      }
      [data-tone="error"] {
        color: #ff9a8a;
      }
      #stage {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: stretch;
        justify-content: center;
      }
      #board {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 620px;
      }
      footer {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tetris Lab</h1>
      <p id="status">booting wasm…</p>
    </header>

    <main id="stage">
      <canvas id="board" role="img" aria-label="Tetris board"></canvas>
    </main>

    <footer>
      <p id="outcome"></p>
      <p id="progress"></p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
