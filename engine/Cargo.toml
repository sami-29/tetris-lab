[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Tetris Lab engine: board, pieces, generator, beam, evaluators. No I/O, no wasm types."

# Zero dependencies, deliberately: the wasm artifact is the engine, and a
# dependency would be a second thing that decides what a game is (ADR 0001).
[dependencies]

[lib]
path = "src/lib.rs"
