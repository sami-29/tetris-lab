[package]
name = "probe"
version = "0.0.0"
edition = "2021"
description = "Throwaway kernel for ticket 09: proves .wasm loads and computes on the host"

[lib]
name = "probe"
path = "src/lib.rs"
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
