<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tetris Lab — search tree at width 200 (ticket 14)</title>
<!--
  Design artifact, ticket 14 ("is a full pannable search tree legible at width 200?").
  Throwaway -- never shipped; the shipped tree view is web/src/ui/tree-*.ts. Kept under
  docs/design/ as the review artifact the tree decision rests on.

  Data is REAL: trace.js holds a layered beam solve at width 200 of Dataset game
  seed 0, frozen at cutover (the throwaway generator is recoverable with
  `git show 4bb9354:prototype/t14-tree/gen_trace.py`). Layers, parents, scores and
  boards are what the engine emitted. No fabricated growth.
-->
<style>
:root{
  --bg:#0e1012; --panel:#15181b; --panel2:#191d21; --line:#23282d; --line2:#2c3238;
  --ink:#c6ccd3; --ink2:#8b959f; --ink3:#5e6873; --ink4:#454e57;
  --amber:#e0a33e; --teal:#3d8f8a; --teal2:#5fc0b8; --red:#c9614f;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Inter,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:12px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
#app{display:grid;height:100vh;grid-template-columns:262px minmax(0,1fr) 268px;
  grid-template-rows:40px minmax(0,1fr) 26px;
  grid-template-areas:"bar bar bar" "side stage info" "status status status"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}

/* bar */
.bar{grid-area:bar;display:flex;align-items:center;border-bottom:1px solid var(--line);background:#101315}
.brand{display:flex;align-items:center;gap:9px;padding:0 14px;height:100%;border-right:1px solid var(--line)}
.brand b{font:600 12px/1 var(--sans);color:#e8edf2}
.brand span{font:400 9px/1 var(--mono);letter-spacing:.14em;color:var(--ink4);text-transform:uppercase}
.tabs{display:flex;height:100%}
.tab{display:flex;align-items:center;gap:6px;padding:0 15px;height:100%;border-right:1px solid var(--line);
  font:500 11px/1 var(--sans);color:var(--ink2)}
.tab:hover{background:#171b1f;color:#e6ecf2}
.tab[aria-selected=true]{color:var(--amber);background:#171b1f;box-shadow:inset 0 -2px 0 var(--amber)}
.barmeta{margin-left:auto;display:flex;align-items:center;height:100%;font:11px var(--mono);color:var(--ink3)}
.barmeta i{font-style:normal;padding:0 12px;border-left:1px solid var(--line);height:100%;display:flex;align-items:center}

/* panes */
.pane{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side{grid-area:side;border-right:1px solid var(--line);overflow-y:auto}
.info{grid-area:info;border-left:1px solid var(--line);overflow-y:auto}
.stage{grid-area:stage;position:relative;min-height:0;overflow:hidden;background:
  radial-gradient(1200px 700px at 30% 0%,#14181c 0%,#0d0f11 60%)}
.phead{display:flex;align-items:center;gap:8px;padding:0 10px;height:26px;flex:0 0 26px;
  border-bottom:1px solid var(--line);background:linear-gradient(#171b1f,#141820)}
.phead .t{font:600 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.phead .s{font:10px var(--mono);color:var(--ink4);margin-left:auto}
.sec{padding:9px 10px;border-bottom:1px solid var(--line)}
.sec > .lbl{font:600 9px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink4);margin-bottom:7px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:7px}
.seg button{background:var(--panel2);padding:5px 0;font:500 10.5px/1 var(--sans);color:var(--ink2)}
.seg button:hover{background:#1f242a;color:var(--ink)}
.seg button[aria-pressed=true]{background:#26200f;color:var(--amber);box-shadow:inset 0 -1px 0 var(--amber)}
.sl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 6px;margin-bottom:8px}
.sl label{font:11px/1 var(--sans);color:var(--ink2)}
.sl output{font:11px/1 var(--mono);color:#dbe2e9;font-variant-numeric:tabular-nums}
.sl input{grid-column:1/-1;width:100%;height:14px;margin:0;-webkit-appearance:none;appearance:none;background:none;cursor:pointer}
.sl input::-webkit-slider-runnable-track{height:2px;background:var(--line2);border-radius:2px}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:14px;margin-top:-6px;border-radius:1px;
  background:var(--amber);border:1px solid #3a2c12}
.chk{display:flex;align-items:center;gap:7px;padding:3px 0;font:11px/1.3 var(--sans);color:var(--ink2);cursor:pointer}
.chk input{appearance:none;width:11px;height:11px;border:1px solid var(--line2);background:#12161a;border-radius:2px;position:relative;cursor:pointer}
.chk input:checked{background:#26200f;border-color:var(--amber)}
.chk input:checked::after{content:"";position:absolute;inset:2px;background:var(--amber);border-radius:1px}
.hint{font:10.5px/1.5 var(--sans);color:var(--ink4);margin-top:4px}
.hint b{color:var(--ink2);font-weight:500}
.row{display:grid;grid-template-columns:1fr auto;gap:6px;font:11px var(--mono);color:var(--ink3);padding:2px 0}
.row b{color:#dbe2e9;font-weight:400;font-variant-numeric:tabular-nums}
.row b.hl{color:var(--amber)}
.row b.tl{color:var(--teal2)}
.swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.mini{display:block;margin:0 auto 8px;background:#0c0e10;border:1px solid var(--line2);border-radius:2px}
.moves{font:10px/1.5 var(--mono);color:var(--ink3);word-break:break-all}
.moves b{color:var(--teal2);font-weight:400}

/* stage overlays */
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv.drag{cursor:grabbing}
.overlay{position:absolute;pointer-events:none;font:10px var(--mono);color:var(--ink4)}
#tip{background:#0b0d0fdd;border:1px solid var(--line2);border-radius:2px;padding:5px 7px;color:var(--ink2);
  font:10.5px/1.5 var(--mono);display:none;z-index:5;white-space:pre;backdrop-filter:blur(2px)}
#zoomhud{right:10px;top:9px;display:flex;gap:8px;align-items:center;pointer-events:auto;z-index:5}
#zoomhud button{border:1px solid var(--line2);background:#12161aaa;color:var(--ink2);padding:3px 7px;border-radius:2px;
  font:10px var(--mono)}
#zoomhud button:hover{color:var(--amber);border-color:#3a2c12}
.status{grid-area:status;display:flex;align-items:center;gap:0;border-top:1px solid var(--line);background:#101315;
  font:10.5px var(--mono);color:var(--ink4);padding:0 12px}
.status i{font-style:normal;padding:0 12px;border-left:1px solid var(--line);height:100%;display:flex;align-items:center}
.status i:first-child{padding-left:0;border-left:0}
.status b{font-weight:400;color:var(--ink2)}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><b>Search tree</b><span>width 200 · real trace</span></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-view="tree">Tree</button>
      <button class="tab" role="tab" aria-selected="false" data-view="ribbon">Score band</button>
      <button class="tab" role="tab" aria-selected="false" data-view="cloud">Board cloud</button>
    </div>
    <div class="barmeta" id="barmeta"></div>
  </header>

  <aside class="side pane">
    <div class="phead"><span class="t">view</span><span class="s" id="sideCount"></span></div>
    <div class="sec">
      <div class="lbl">order</div>
      <div class="seg" id="orderSeg">
        <button data-order="score" aria-pressed="true">by score</button>
        <button data-order="rank" aria-pressed="false">by rank</button>
        <button data-order="bary" aria-pressed="false">by parent</button>
      </div>
      <div class="sl">
        <label for="k">keep top <span id="kTxt">200</span> per layer</label>
        <output id="kOut">200</output>
        <input id="k" type="range" min="1" max="200" step="1" value="200">
      </div>
      <label class="chk"><input type="checkbox" id="edges" checked> draw edges</label>
      <label class="chk"><input type="checkbox" id="path" checked> mark the winning lineage</label>
      <label class="chk"><input type="checkbox" id="spine"> mark the greedy spine</label>
      <label class="chk"><input type="checkbox" id="dim"> dim everything off the selection</label>
    </div>
    <div class="sec">
      <div class="lbl">reading it</div>
      <div class="hint" id="readHint"></div>
    </div>
    <div class="sec">
      <div class="lbl">how to drive it</div>
      <div class="hint"><b>drag</b> pans · <b>wheel</b> zooms at the cursor · <b>click</b> a node pins it
      · <b>0</b> fits · <b>1</b>…<b>9</b> jumps a layer</div>
    </div>
  </aside>

  <main class="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="tip"></div>
    <div class="overlay" id="zoomhud">
      <button id="fit">fit</button>
      <button id="zin">+</button>
      <button id="zout">−</button>
    </div>
  </main>

  <aside class="info pane">
    <div class="phead"><span class="t">layer</span><span class="s" id="layerTag"></span></div>
    <div class="sec" id="layerStats"></div>
    <div class="phead"><span class="t">state</span><span class="s" id="stateTag"></span></div>
    <div class="sec" id="stateStats"></div>
  </aside>

  <footer class="status" id="status"></footer>
</div>

<script src="trace.js"></script>
<script>
'use strict';
const T = window.TRACE;
const LAY = T.layers;
const MET = T.metrics;
const BEST = new Map(T.best.map(r => [r.layer, r]));
const SPINE = new Map(T.spine.map(r => [r.layer, r]));
const H = 20, W = 10;

const BEST_PATH = new Set();        // "layer:index" on the winning lineage
(function () {
  let idx = 0;
  const last = LAY[LAY.length - 1];
  idx = 0;
  for (let i = 1; i < last.st.length; i++) if (last.st[i][1] > last.st[idx][1]) idx = i;
  for (let li = LAY.length - 1; li >= 1; li--) {
    BEST_PATH.add(li + ':' + idx);
    idx = LAY[li].st[idx][0];
  }
})();

const SPINE_PATH = new Set();       // greedy best-child chain from the root
(function () {
  const home = {};
  home[0] = 0;
  for (let li = 1; li < LAY.length; li++) {
    let best = -1, bestS = -Infinity;
    for (let i = 0; i < LAY[li].st.length; i++) {
      const p = LAY[li].st[i][0];
      if (home[li - 1] !== p) continue;
      const s = LAY[li].st[i][1];
      if (s > bestS) { bestS = s; best = i; }
    }
    if (best < 0) break;
    home[li] = best;
    SPINE_PATH.add(li + ':' + best);
  }
})();

// kids[li][i] = child indices in layer li+1
const KIDS = LAY.map(() => null);
for (let li = 1; li < LAY.length; li++) {
  if (!KIDS[li - 1]) KIDS[li - 1] = LAY[li - 1].st.map(() => []);
  LAY[li].st.forEach((s, i) => KIDS[li - 1][s[0]].push(i));
}

// ── helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = String(text);
  return n;
}
function rowEl(k, v, cls) {
  const d = el('div', 'row');
  d.appendChild(el('span', null, k));
  d.appendChild(el('b', cls || null, v));
  return d;
}
function chip(label, value, cls) {
  const i = el('i');
  const s = el('span', null, label);
  s.style.marginRight = '4px';
  i.appendChild(s);
  i.appendChild(el('b', cls || null, value));
  return i;
}

function decode(hex) {
  const cols = new Uint16Array(W);
  for (let c = 0; c < W; c++) cols[c] = parseInt(hex.substr(c * 5, 5), 16);
  return cols;
}
const DEC = LAY.map(l => l.st.map(s => decode(s[3])));

let sMin = Infinity, sMax = -Infinity;
LAY.forEach(l => l.st.forEach(s => { if (s[1] < sMin) sMin = s[1]; if (s[1] > sMax) sMax = s[1]; }));

// ── state ───────────────────────────────────────────────────────────────────
const view = { mode: 'tree', order: 'score', k: 200, edges: true, path: true, spine: false, dim: false };
const cam = { z: 1, tx: 30, ty: 20 };
let sel = null;          // {li, i}
let hover = null;        // {li, i}
let nodes = [];          // flat, current layout: {li, i, x, y, s, r}
let drawn = 0;
const cv = $('cv');
const ctx = cv.getContext('2d');

function layerVisible(li) {
  const n = LAY[li].st.length;
  return Math.min(n, view.k);
}

// ── layout ──────────────────────────────────────────────────────────────────
const LSTEP = 104;                 // world units between layers
const ROW = 3.2;                   // world units between ranks at k=200
const PADX = 34, PADY = 16;

function layout() {
  nodes = [];
  drawn = 0;
  const ys = [];                   // ys[li][i]
  const pad = Math.max(0, sMax - sMin) || 1;
  for (let li = 0; li < LAY.length; li++) {
    const st = LAY[li].st;
    const n = Math.min(st.length, view.k);
    const x = PADX + li * LSTEP;
    const arr = new Float64Array(st.length);
    const order = [];
    for (let i = 0; i < st.length; i++) order.push(i);
    // rank order is always by score desc
    order.sort((a, b) => st[b][1] - st[a][1] || a - b);
    const top = order.slice(0, n);

    if (view.order === 'score') {
      for (const i of top) {
        const t = (sMax - st[i][1]) / pad;
        arr[i] = PADY + t * 1600;
      }
    } else if (view.order === 'rank') {
      top.forEach((i, r) => { arr[i] = PADY + r * ROW; });
    } else {
      // barycenter of visible parents, then a monotone spacing pass
      const prev = ys[li - 1];
      const bary = top.map(i => {
        const p = st[i][0];
        return prev && p >= 0 && Number.isFinite(prev[p]) ? prev[p] : PADY + 800;
      });
      const idx = top.map((i, r) => ({ i, b: bary[r], r }));
      idx.sort((a, b) => a.b - b.b || a.r - b.r);
      let y = -Infinity;
      for (const e of idx) {
        y = Math.max(e.b, y + ROW);
        arr[e.i] = y;
      }
    }
    ys.push(arr);
    for (const i of top) {
      nodes.push({ li, i, x, y: arr[i], s: st[i][1], r: 1 });
    }
    drawn += n;
  }
  // radius in world units: a bit under a rank slot so neighbours read separately
  const r = Math.max(0.9, Math.min(3.4, ROW * 0.34));
  nodes.forEach(nd => { nd.r = r; });

  // world bounds
  let y0 = Infinity, y1 = -Infinity;
  nodes.forEach(nd => { if (nd.y < y0) y0 = nd.y; if (nd.y > y1) y1 = nd.y; });
  layoutBounds = { x0: PADX, x1: PADX + (LAY.length - 1) * LSTEP, y0: y0 - PADY, y1: y1 + PADY };
}
let layoutBounds = { x0: 0, x1: 1, y0: 0, y1: 1 };

function visibleSet() {
  const s = new Set();
  nodes.forEach(nd => s.add(nd.li + ':' + nd.i));
  return s;
}
function isVisible(li, i) {
  return i < layerVisible(li);
}

// ── camera ──────────────────────────────────────────────────────────────────
function fit() {
  const b = layoutBounds;
  const w = cv.clientWidth, h = cv.clientHeight;
  const z = Math.min((w - 60) / Math.max(1, b.x1 - b.x0), (h - 60) / Math.max(1, b.y1 - b.y0));
  cam.z = clamp(z, 0.05, 12);
  cam.tx = 30 - b.x0 * cam.z + (w - (b.x1 - b.x0) * cam.z) / 2 - 30;
  cam.ty = 30 - b.y0 * cam.z + (h - (b.y1 - b.y0) * cam.z) / 2 - 30;
  draw();
}
function toScreen(x, y) { return [x * cam.z + cam.tx, y * cam.z + cam.ty]; }
function toWorld(sx, sy) { return [(sx - cam.tx) / cam.z, (sy - cam.ty) / cam.z]; }

// ── drawing ─────────────────────────────────────────────────────────────────
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cv.clientWidth * dpr);
  cv.height = Math.round(cv.clientHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function scoreColor(t, a) {
  // t=0 low score (dim teal), t=1 best (amber)
  const c = t > 0.82
    ? `rgba(224,163,62,${a})`
    : t > 0.5
      ? `rgba(95,192,184,${a * 0.92})`
      : `rgba(61,143,138,${a * 0.72})`;
  return c;
}

function draw() {
  ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
  if (view.mode === 'tree') drawTree();
  else if (view.mode === 'ribbon') drawRibbon();
  else drawCloud();
  updateStatus();
}

function drawTree() {
  const stOf = i => LAY[i];
  const z = cam.z;
  // per-layer score range for colour
  const rng = MET.map(m => [m.smin, m.smax]);

  if (view.edges && z > 0.06) {
    ctx.lineWidth = Math.max(0.4, Math.min(1.1, z * 0.7));
    const seen = new Map();
    for (const nd of nodes) {
      if (nd.li === 0) continue;
      const p = stOf(nd.li).st[nd.i][0];
      if (!isVisible(nd.li - 1, p)) continue;
      const pn = nodeAt(nd.li - 1, p);
      if (!pn) continue;
      const onBest = BEST_PATH.has(nd.li + ':' + nd.i) && BEST_PATH.has((nd.li - 1) + ':' + p);
      const onSpine = SPINE_PATH.has(nd.li + ':' + nd.i) && SPINE_PATH.has((nd.li - 1) + ':' + p);
      const key = onBest && view.path ? 'b' : onSpine && view.spine ? 's' : 'n';
      if (!seen.has(key)) seen.set(key, []);
      seen.get(key).push([nd.x, nd.y, pn.x, pn.y]);
    }
    for (const [key, segs] of seen) {
      ctx.beginPath();
      for (const [x1, y1, x2, y2] of segs) {
        const [sx1, sy1] = toScreen(x1, y1);
        const [sx2, sy2] = toScreen(x2, y2);
        ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2);
      }
      ctx.strokeStyle = key === 'b' ? 'rgba(224,163,62,0.75)'
        : key === 's' ? 'rgba(201,97,79,0.62)'
          : 'rgba(93,143,139,0.17)';
      ctx.stroke();
    }
  }

  const selAnc = sel ? ancestry(sel) : null;
  const selDesc = sel ? descent(sel) : null;

  for (const nd of nodes) {
    const [sx, sy] = toScreen(nd.x, nd.y);
    if (sx < -20 || sx > cv.clientWidth + 20 || sy < -20 || sy > cv.clientHeight + 20) continue;
    const [lo, hi] = rng[nd.li];
    const span = Math.max(1e-6, hi - lo);
    const t = (nd.s - lo) / span;
    const key = nd.li + ':' + nd.i;
    let alpha = 0.55 + 0.4 * t;
    let col = scoreColor(t, alpha);
    if (view.dim && sel) {
      const on = selAnc.has(key) || selDesc.has(key);
      if (!on) col = 'rgba(70,80,88,0.30)';
    }
    if (view.path && BEST_PATH.has(key)) col = 'rgba(224,163,62,1)';
    if (view.spine && SPINE_PATH.has(key)) col = 'rgba(201,97,79,1)';
    if (sel && key === sel.li + ':' + sel.i) col = '#ffffff';
    const rr = Math.max(0.7, nd.r * z);
    ctx.fillStyle = col;
    if (rr < 1.1) {
      ctx.fillRect(sx - rr, sy - rr, rr * 2, rr * 2);
    } else {
      ctx.beginPath(); ctx.arc(sx, sy, rr, 0, 6.2832); ctx.fill();
    }
  }

  // layer ruler
  ctx.font = '9px ui-monospace, monospace';
  const step = layerStep();
  for (let li = 0; li < LAY.length; li += step) {
    const [sx] = toScreen(PADX + li * LSTEP, 0);
    ctx.fillStyle = 'rgba(120,132,143,0.85)';
    ctx.textAlign = 'center';
    ctx.fillText('L' + li + ' ' + (LAY[li].piece === 'root' ? '' : LAY[li].piece), sx, 14);
  }
  if (sel) {
    const nd = nodeAt(sel.li, sel.i);
    if (nd) {
      const [sx, sy] = toScreen(nd.x, nd.y);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(sx, sy, Math.max(4, nd.r * z + 3), 0, 6.2832); ctx.stroke();
    }
  }
}

function layerStep() {
  // label every nth layer so labels never collide on screen
  const every = Math.max(1, Math.ceil(46 / Math.max(6, LSTEP * cam.z)));
  return every;
}

function nodeAt(li, i) {
  for (const nd of nodes) if (nd.li === li && nd.i === i) return nd;
  return null;
}

function ancestry(s) {
  const set = new Set();
  let li = s.li, i = s.i;
  while (li >= 0) {
    set.add(li + ':' + i);
    if (li === 0) break;
    i = LAY[li].st[i][0];
    li--;
  }
  return set;
}
function descent(s) {
  const set = new Set();
  const stack = [[s.li, s.i]];
  while (stack.length) {
    const [li, i] = stack.pop();
    const key = li + ':' + i;
    if (set.has(key)) continue;
    set.add(key);
    if (li + 1 >= LAY.length) continue;
    for (const k of KIDS[li][i]) stack.push([li + 1, k]);
  }
  return set;
}

// ── ribbon: the beam as a band, not a graph ─────────────────────────────────
function drawRibbon() {
  const pad = 46;
  const w = cv.clientWidth - pad * 2;
  const h = cv.clientHeight - 96;
  const yOf = s => 54 + (sMax - s) / Math.max(1e-6, sMax - sMin) * h;
  const xOf = li => pad + (li / (LAY.length - 1)) * w;

  // global band
  for (let li = 0; li < LAY.length; li++) {
    const m = MET[li];
    const x = xOf(li);
    const halfW = Math.min(16, w / LAY.length * 0.34);
    ctx.fillStyle = 'rgba(61,143,138,0.20)';
    ctx.fillRect(x - halfW, yOf(m.smax), halfW * 2, Math.max(1, yOf(m.smin) - yOf(m.smax)));
    ctx.fillStyle = 'rgba(95,192,184,0.55)';
    ctx.fillRect(x - halfW, yOf(m.smax), halfW * 2, 1);
    ctx.fillStyle = 'rgba(95,192,184,0.9)';
    ctx.fillRect(x - halfW, yOf(m.p50), halfW * 2, Math.max(0.6, 0.6));
  }
  // enveloppe of the band across layers
  ctx.beginPath();
  for (let li = 0; li < LAY.length; li++) {
    const [x, y] = [xOf(li), yOf(MET[li].smax)];
    li ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.strokeStyle = 'rgba(95,192,184,0.35)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // winning lineage
  if (view.path) {
    ctx.beginPath();
    T.best.forEach((r, idx) => {
      const x = xOf(r.layer);
      const y = yOf(r.score);
      if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = 'rgba(224,163,62,0.85)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.fillStyle = 'rgba(224,163,62,0.95)';
    for (const r of T.best) {
      const x = xOf(r.layer);
      const y = yOf(r.score);
      ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 6.2832); ctx.fill();
    }
  }

  // axis
  ctx.font = '9px ui-monospace, monospace';
  ctx.textAlign = 'right';
  const ticks = 5;
  for (let t = 0; t <= ticks; t++) {
    const s = sMin + (sMax - sMin) * (t / ticks);
    const y = yOf(s);
    ctx.fillStyle = 'rgba(94,104,115,0.9)';
    ctx.fillText(f1(s), pad - 8, y + 3);
    ctx.strokeStyle = 'rgba(44,50,56,0.8)';
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(pad + w, y); ctx.stroke();
  }
  ctx.textAlign = 'center';
  for (let li = 0; li < LAY.length; li++) {
    ctx.fillStyle = li % 2 ? 'rgba(70,80,88,0.95)' : 'rgba(120,132,143,0.95)';
    ctx.fillText(li + (LAY[li].piece === 'root' ? '' : LAY[li].piece), xOf(li), 42 + h + 28);
  }
  ctx.fillStyle = 'rgba(139,149,159,0.95)';
  ctx.fillText('layer / piece', pad + w / 2, 42 + h + 46);
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(95,192,184,0.9)';
  ctx.fillText('band = every surviving state, best to worst', pad, 22);
  ctx.fillStyle = 'rgba(224,163,62,0.95)';
  ctx.fillText('AMBER = the lineage that ends as the best final state', pad, 36);
}

// ── cloud: where the beam actually disagrees ────────────────────────────────
function drawCloud() {
  const cell = Math.max(3, Math.min(9, (cv.clientWidth - 80) / LAY.length / W * 0.9));
  const bw = W * cell, bh = H * cell;
  const padX = 30, padY = 60;
  ctx.font = '9px ui-monospace, monospace';
  for (let li = 0; li < LAY.length; li++) {
    const x = padX + li * (bw + 8);
    if (x > cv.clientWidth) break;
    const n = LAY[li].st.length;
    const occ = new Float32Array(W * H);
    for (let i = 0; i < n; i++) {
      const cols = DEC[li][i];
      for (let c = 0; c < W; c++) {
        const word = cols[c];
        if (!word) continue;
        for (let r = 0; r < H; r++) {
          if ((word >> (H - 1 - r)) & 1) occ[r * W + c] += 1;
        }
      }
    }
    for (let r = 0; r < H; r++) {
      for (let c = 0; c < W; c++) {
        const f = occ[r * W + c] / n;
        const base = f > 0 ? 0.1 + 0.9 * f : 0;
        ctx.fillStyle = f > 0
          ? `rgba(${Math.round(110 + 110 * f)},${Math.round(140 + 20 * f)},${Math.round(130 - 60 * f)},${0.14 + 0.86 * f})`
          : 'rgba(30,36,41,0.75)';
        if (base > 0) ctx.fillStyle = `rgba(224,163,62,${0.06 + 0.86 * f})`;
        ctx.fillRect(x + c * cell, padY + r * cell, cell - 0.4, cell - 0.4);
      }
    }
    ctx.fillStyle = 'rgba(120,132,143,0.95)';
    ctx.textAlign = 'center';
    ctx.fillText('L' + li, x + bw / 2, padY - 8);
    ctx.fillStyle = 'rgba(70,80,88,0.95)';
    ctx.fillText(LAY[li].piece === 'root' ? '·' : LAY[li].piece, x + bw / 2, padY + bh + 11);
    ctx.fillStyle = 'rgba(94,104,115,0.8)';
    ctx.fillText('±' + Math.round(MET[li].dist_mean), x + bw / 2, padY + bh + 23);
  }
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(139,149,159,0.95)';
  ctx.fillText('one mini-board per layer: how full each cell is, averaged over that layer\'s surviving boards', padX, 18);
  ctx.fillStyle = 'rgba(94,104,115,0.9)';
  ctx.fillText('±N under a board = mean cells differing between two boards of that layer (of 200)', padX, 32);
}

// ── status + panels ─────────────────────────────────────────────────────────
function updateStatus() {
  const m = hover || sel ? MET[(hover || sel).li] : MET[MET.length - 1];
  const host = $('status');
  host.textContent = '';
  host.appendChild(chip('seed', T.meta.seed));
  host.appendChild(chip('width', T.meta.width));
  host.appendChild(chip('goal', T.meta.goal));
  host.appendChild(chip('pieces', T.meta.pieces_used));
  host.appendChild(chip('nodes drawn', view.mode === 'tree' ? drawn : '—'));
  host.appendChild(chip('zoom', cam.z.toFixed(2) + '×'));
  host.appendChild(chip('L' + m.layer, m.n + ' kept / ' + m.cand + ' cand · dup ' + m.dup_pct.toFixed(1) + '%'));
}

function paintInfo(li) {
  const m = MET[li];
  $('layerTag').textContent = 'L' + li + (LAY[li].piece === 'root' ? '' : ' · ' + LAY[li].piece);
  const host = $('layerStats');
  host.textContent = '';
  [
    rowEl('kept / candidates', `${m.n} / ${m.cand}`),
    rowEl('deduped boards', `${m.distinct} (${m.dup_pct.toFixed(1)}% dup)`),
    rowEl('score best / worst', `${f1(m.smax)} / ${f1(m.smin)}`),
    rowEl('score spread', f1(m.spread), 'hl'),
    rowEl('median shift per rank', (m.spread / Math.max(1, m.n - 1)).toFixed(2)),
    rowEl('mean board distance', m.dist_mean.toFixed(0) + ' cells'),
    rowEl('distance from best', m.dist_best.toFixed(0) + ' cells'),
    rowEl('states with a child', `${m.with_kids} / ${m.n}`),
    rowEl('max children', m.max_kids),
    rowEl(`ancestors at L${m.anc_of}`, `${m.anc_distinct} (top ${m.anc_top_share})`, 'tl'),
    rowEl('winning lineage rank', BEST.has(li) ? `${BEST.get(li).rank + 1} / ${BEST.get(li).of}` : '—', 'hl'),
    rowEl('greedy spine rank', SPINE.has(li) ? `${SPINE.get(li).rank + 1} / ${SPINE.get(li).of}` : 'dead-end'),
  ].forEach(r => host.appendChild(r));
}

function paintState() {
  const host = $('stateStats');
  host.textContent = '';
  if (!sel) {
    $('stateTag').textContent = 'none';
    host.appendChild(el('div', 'hint', 'Click a node in the tree to pin it. Its lineage lights up amber, its descendants teal, and its board appears here.'));
    return;
  }
  const s = LAY[sel.li].st[sel.i];
  const m = MET[sel.li];
  $('stateTag').textContent = 'L' + sel.li + ' #' + (sel.i + 1);
  const cvb = el('canvas', 'mini');
  cvb.width = 10 * 9; cvb.height = 20 * 9;
  const b = cvb.getContext('2d');
  const cols = DEC[sel.li][sel.i];
  const inPath = BEST_PATH.has(sel.li + ':' + sel.i);
  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const on = (cols[c] >> (H - 1 - r)) & 1;
      b.fillStyle = on ? (inPath ? '#e0a33e' : '#3d8f8a') : '#14181c';
      b.fillRect(c * 9 + 0.5, r * 9 + 0.5, 8, 8);
    }
  }
  const kidCount = (KIDS[sel.li] && KIDS[sel.li][sel.i]) ? KIDS[sel.li][sel.i].length : 0;
  host.appendChild(cvb);
  [
    rowEl('score', f1(s[1]), 'hl'),
    rowEl('rank in layer', `${rankOf(sel.li, sel.i) + 1} / ${m.n}`),
    rowEl('lines cleared', s[2]),
    rowEl('move', `${LAY[sel.li].piece} rot ${s[4]} col ${s[5]}`),
    rowEl('landing height', s[6]),
    rowEl('children', kidCount),
    rowEl('on winning lineage', inPath ? 'yes' : 'no', inPath ? 'hl' : ''),
  ].forEach(r => host.appendChild(r));
  host.appendChild(lineageMoves(sel));
}

function rankOf(li, i) {
  const st = LAY[li].st;
  const s = st[i][1];
  let r = 0;
  for (let k = 0; k < st.length; k++) if (st[k][1] > s) r++;
  return r;
}

function lineageMoves(s) {
  const out = el('div', 'moves');
  out.style.marginTop = '8px';
  const parts = [];
  let li = s.li, i = s.i;
  while (li > 0) {
    const st = LAY[li].st[i];
    parts.push({ piece: LAY[li].piece, move: `${st[4]}/${st[5]}` });
    i = st[0]; li--;
  }
  parts.reverse();
  parts.forEach((p, idx) => {
    if (idx) out.appendChild(document.createTextNode(' · '));
    out.appendChild(el('b', null, p.piece + p.move));
  });
  return out;
}

// ── interaction ─────────────────────────────────────────────────────────────
function pick(sx, sy) {
  let best = null, bd = 15 * 15;
  for (const nd of nodes) {
    const [x, y] = toScreen(nd.x, nd.y);
    const d = (x - sx) * (x - sx) + (y - sy) * (y - sy);
    if (d < bd) { bd = d; best = nd; }
  }
  return best;
}

let dragging = false, dragMoved = 0, last = { x: 0, y: 0 };
cv.addEventListener('pointerdown', e => {
  dragging = true; dragMoved = 0; last = { x: e.clientX, y: e.clientY };
  cv.classList.add('drag'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  if (dragging) {
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    cam.tx += dx; cam.ty += dy;
    last = { x: e.clientX, y: e.clientY };
    draw();
    return;
  }
  if (view.mode !== 'tree') return;
  hover = null;
  const nd = pick(sx, sy);
  const tip = $('tip');
  if (nd) {
    hover = { li: nd.li, i: nd.i };
    const s = LAY[nd.li].st[nd.i];
    const onBest = BEST_PATH.has(nd.li + ':' + nd.i);
    tip.textContent =
      `L${nd.li}  #${nd.i + 1} of ${LAY[nd.li].st.length}\n` +
      `score ${f1(s[1])}   lines ${s[2]}\n` +
      `move  ${LAY[nd.li].piece} rot ${s[4]} col ${s[5]}` +
      (onBest ? '\n↑ winning lineage' : '');
    tip.style.display = 'block';
    tip.style.left = Math.min(cv.clientWidth - 190, sx + 14) + 'px';
    tip.style.top = Math.min(cv.clientHeight - 70, sy + 14) + 'px';
    paintInfo(nd.li);
  } else {
    tip.style.display = 'none';
  }
  draw();
});
cv.addEventListener('pointerup', e => {
  if (dragging && dragMoved < 4) {
    const r = cv.getBoundingClientRect();
    const nd = pick(e.clientX - r.left, e.clientY - r.top);
    sel = nd ? { li: nd.li, i: nd.i } : null;
    paintState();
    if (sel) paintInfo(sel.li);
    draw();
  }
  dragging = false; cv.classList.remove('drag');
});
cv.addEventListener('pointerleave', () => { $('tip').style.display = 'none'; hover = null; draw(); });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const [wx, wy] = toWorld(sx, sy);
  const factor = e.deltaY < 0 ? 1.14 : 1 / 1.14;
  cam.z = clamp(cam.z * factor, 0.05, 40);
  cam.tx = sx - wx * cam.z;
  cam.ty = sy - wy * cam.z;
  draw();
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.key === '0') { layout(); fit(); }
  else if (e.key === '+' || e.key === '=') { cam.z = clamp(cam.z * 1.2, 0.05, 40); draw(); }
  else if (e.key === '-' || e.key === '_') { cam.z = clamp(cam.z / 1.2, 0.05, 40); draw(); }
  else if (/^[1-9]$/.test(e.key)) {
    const li = Math.min(LAY.length - 1, parseInt(e.key, 10) - 1);
    cam.tx = -PADX * cam.z + 40;
    cam.ty = -(layoutBounds.y0) * cam.z + 40;
    sel = { li, i: 0 };
    paintState(); paintInfo(li); draw();
  }
});

// tabs
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b === btn)));
    view.mode = btn.dataset.view;
    $('readHint').textContent = HINTS[view.mode];
    $('tip').style.display = 'none';
    draw();
  });
});

document.querySelectorAll('#orderSeg button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#orderSeg button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    view.order = btn.dataset.order;
    layout(); fit();
  });
});

$('k').addEventListener('input', e => {
  view.k = parseInt(e.target.value, 10);
  $('kTxt').textContent = view.k;
  $('kOut').textContent = view.k;
  layout();
  if (view.mode === 'tree') fit();
  else draw();
  updateCounts();
});
['edges', 'path', 'spine', 'dim'].forEach(id => {
  $(id).addEventListener('change', e => { view[id] = e.target.checked; draw(); });
});
$('fit').addEventListener('click', () => { layout(); fit(); });
$('zin').addEventListener('click', () => { cam.z = clamp(cam.z * 1.25, 0.05, 40); draw(); });
$('zout').addEventListener('click', () => { cam.z = clamp(cam.z / 1.25, 0.05, 40); draw(); });
window.addEventListener('resize', resize);

const HINTS = {
  tree: 'Each dot is a surviving board; each edge is the placement that produced it. If the dots read as a field of noise, the tree is not the deliverable. Try “by parent” to follow lineages, and pull “keep top” down until the picture becomes readable — the k at which it does is the honest bound.',
  ribbon: 'The same data with the graph removed: one vertical band per layer holding all its states, worst to best, plus the median. The amber line is the lineage that ends as the best final state — watch how it drifts through the band, including spells near the bottom.',
  cloud: 'Averaged boards: each cell is the share of the layer’s surviving boards that fill it. Where the boards agree the cells go solid; where the beam is genuinely undecided they stay grey. This is the beam’s disagreement, which is what a tree is supposed to show.',
};

function updateCounts() {
  $('sideCount').textContent = layerVisible(0) + '…' + layerVisible(LAY.length - 1) + ' per layer';
  $('kOut').textContent = view.k;
  $('kTxt').textContent = view.k;
  if (sel) paintInfo(sel.li);
  else paintInfo(hover ? hover.li : MET.length - 1);
}

function boot() {
  // preset views: ?view=ribbon&order=bary&k=20
  const q = new URLSearchParams(location.search);
  if (q.has('view') && HINTS[q.get('view')]) view.mode = q.get('view');
  if (q.has('order') && ['score', 'rank', 'bary'].includes(q.get('order'))) view.order = q.get('order');
  if (q.has('k')) view.k = clamp(parseInt(q.get('k'), 10) || 200, 1, 200);
  if (q.get('path') === '0') view.path = false;
  if (q.get('edges') === '0') view.edges = false;
  if (q.get('dim') === '1') view.dim = true;
  document.querySelectorAll('.tab').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.view === view.mode)));
  document.querySelectorAll('#orderSeg button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.order === view.order)));
  $('k').value = String(view.k);
  $('edges').checked = view.edges;
  $('path').checked = view.path;
  $('dim').checked = view.dim;

  const bm = $('barmeta');
  bm.textContent = '';
  bm.appendChild(chip('', T.meta.header.trim()));
  bm.appendChild(chip('seed', T.meta.seed));
  bm.appendChild(chip('score', f1(sMin) + ' … ' + f1(sMax)));
  $('readHint').textContent = HINTS[view.mode];
  layout();
  resize();
  fit();
  if (q.has('z')) {
    const li = clamp(parseInt(q.get('l'), 10) || 0, 0, LAY.length - 1);
    cam.z = clamp(parseFloat(q.get('z')) || 1, 0.05, 40);
    let y0 = Infinity, y1 = -Infinity;
    nodes.forEach(nd => { if (nd.li === li) { y0 = Math.min(y0, nd.y); y1 = Math.max(y1, nd.y); } });
    cam.tx = cv.clientWidth / 2 - (PADX + li * LSTEP) * cam.z;
    cam.ty = cv.clientHeight / 2 - ((y0 + y1) / 2) * cam.z;
    sel = { li, i: 0 };
    paintState();
    paintInfo(li);
    draw();
  }
  paintState();
  paintInfo(MET.length - 1);
  updateCounts();
}
boot();
</script>
</body>
